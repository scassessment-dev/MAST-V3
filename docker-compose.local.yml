services:
  mariadb:
    image: mariadb:11.8.9
    container_name: mast-v3-local-mariadb
    restart: unless-stopped
    env_file:
      - .env.mariadb.local
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ./data/mariadb-local:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
